<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="vidkeep · 自建视频站" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234b6f5a'/%3E%3Cpath d='M13 9.5l10 6.5-10 6.5z' fill='%23fdfdfd'/%3E%3C/svg%3E"
    />
    <title>vidkeep</title>
    <script>
      // 首屏提前应用主题，避免深浅色闪烁（与 src/utils/theme.ts 保持一致）
      (function () {
        try {
          var saved = localStorage.getItem('vidkeep_theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
