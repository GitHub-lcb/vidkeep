# ===========================================
# vidkeep 后端主配置（所有环境共享）
# 敏感信息一律通过环境变量注入，禁止写入仓库
# ===========================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: vidkeep-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      # 不使用 Spring Security 默认表单用户；鉴权完全走 JWT，避免启动时生成随机密码
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 时间统一 Asia/Shanghai，DATETIME 存本地时间
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:vidkeep}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    # 无默认值：必须由环境变量提供，避免密码进入仓库
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.vidkeep.module
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    # 必须 ≥32 字节，通过环境变量 JWT_SECRET 注入（≥32 字符）
    secret: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
  cors:
    # 本地开发由 Vite 代理转发，一般无需跨域；此处保留显式白名单
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    data-dir: ${DATA_DIR:./data}
  upload:
    # 单分片 5MB（文档 7.1.3 固定值）
    chunk-size-bytes: 5242880
    # 单文件上限 10GB（文档 7.1.5）
    max-file-size-bytes: 10737418240
  transcode:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    # 转码 Worker：dev/worker profile 为 true，prod 的 app 容器为 false（由 compose 的 worker 容器消费队列）
    worker-enabled: ${TRANSCODE_WORKER_ENABLED:true}
    hls-time-seconds: 6
  play:
    # P1 防盗链：播放地址签名密钥（未配置时回退 JWT_SECRET）
    token-secret: ${PLAY_TOKEN_SECRET:${JWT_SECRET:}}
    # 签名有效期（秒），文档建议 2 小时
    token-expire-seconds: ${PLAY_TOKEN_EXPIRE_SECONDS:7200}
    # m3u8 改写出的子列表/切片签名有效期（默认 12 小时，覆盖长视频连续播放）
    segment-expire-seconds: ${PLAY_SEGMENT_EXPIRE_SECONDS:43200}
  site:
    # P1 站点访问口令（F-18）：为空表示不启用
    access-password: ${SITE_ACCESS_PASSWORD:}
    token-secret: ${SITE_TOKEN_SECRET:${JWT_SECRET:}}
    # 口令通过后的 cookie 有效期（默认 30 天）
    token-expire-seconds: ${SITE_TOKEN_EXPIRE_SECONDS:2592000}
    cookie-name: ${SITE_COOKIE_NAME:vidkeep_site_token}
